# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint commits

on:
  pull_request:
    branches:
      - main

concurrency:
  # each new commit to a PR runs this workflow
  # so we need to avoid a long running older one from overwriting the 'pr-<number>-latest'
  group: "${{ github.workflow }} @ ${{ github.ref_name }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          fetch-depth: 0

      - name: Disallow merge-style messages on non-merge commits
        shell: bash
        run: |
          # cliff.toml exempts ^Merge messages from linting, ensure only real merge commits use that form
          if git log --no-merges --format="%h %s" "origin/${GITHUB_BASE_REF}..HEAD" | grep "^[0-9a-f]* Merge"; then
            echo "The commit(s) above are not merges, rewrite their messages to be conventional"
            exit 1
          fi

      - name: Install git-cliff to lint commits
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: git-cliff

      - name: Check the commits
        shell: bash
        env:
          GIT_CLIFF__GIT__REQUIRE_CONVENTIONAL: "true"
        run: |
          # --offline skips the GitHub metadata fetch, which linting does not need
          git-cliff --offline > /dev/null
